name: Build QARAJAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o "$(ls *.zip | head -1)" -d source

      - name: Build APK
        run: |
          cd source/Qarajat
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: QARAJAT-APK
          path: source/Qarajat/app/build/outputs/apk/debug/app-debug.apk
